[project]
name = "dvf-lakehouse"
version = "0.1.0"
description = "Lakehouse local sur les ventes immobilières françaises (DVF), même pipeline en PySpark et en DuckDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "pyspark==4.2.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvf_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.tmp/pytest"
