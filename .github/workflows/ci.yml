name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dépendances
        run: |
          uv venv --python 3.12
          uv sync --frozen

      - name: Tests (fixture DVF synthétique, Spark et DuckDB)
        run: .venv/bin/python -m pytest -v
